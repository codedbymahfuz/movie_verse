name: movie_verse
description: "A Flutter movie and TV show app built with TMDB API, BLoC, and Clean Architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  carousel_slider: ^5.1.2
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.2
  equatable: ^3.0.0
  cached_network_image: ^4.0.3
  shimmer: ^4.0.0
  youtube_player_flutter: ^10.0.1
  get_it: ^9.3.0
  connectivity_plus: ^7.3.2
  lottie: ^3.6.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
   - lib/app/assets/animations/
